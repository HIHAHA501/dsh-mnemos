# DSH 插件注册补丁
# 用 insert 而不是覆盖：不动宿主已有的插件列表，同一个 profile 里其它插件照常加载
- insert:
    - id: dsh-mnemos
      name: 'dsh-mnemos'
      config:
        # 用户要求：默认不记录（面板「记忆 · 开/关」仍是全局开关，可随时打开）
        ingest:
          capture: false
        # 人格由 dsh-persona-dafeiyu 负责编辑与注入；mnemos 只读快照、不再自己注入人设段。
        # url 用相对路径：宿主端口每次启动都是 OS 随机的，写死端口会在下次启动失效。
        persona:
          mode: external
          kind: http
          url: /api/dsh-persona-dafeiyu
          adapter: dafeiyu
          refresh: turn        # 跟随 dafeiyu 切换：60 秒节流、fire-and-forget
      # 下面全部是**示例**，全部注释掉等于用默认值跑，不是关掉插件。
      # config:
      #   enabled: true              # 关掉只停记忆功能，不卸载插件
      #   dataDir: null              # 默认 <profile 目录>/dsh-mnemos；换目录等于换一份记忆
      #   mode: general              # general | companion，companion 更爱主动引用记忆
      #
      #   hotTokenBudget: 1200       # 「热记忆」段落最多占多少 token
      #   injectTokenBudget: 600     # 单轮检索结果注入的上限
      #   topN: 6                    # 单轮最多挑几条记忆
      #
      #   vector:
      #     enabled: auto            # auto | off | on，auto 表示探到配置齐全才开
      #     provider: none           # none | local | api
      #     model: null
      #     endpoint: null
      #     apiKeyEnv: null          # 只写环境变量名，密钥本身不进配置文件
      #
      #   proactive:
      #     enabled: true
      #     quoteThreshold: 0.62     # 高于它才「直接引用」
      #     askThreshold: 0.45       # 高于它才「试探性提起」
      #     noiseFloor: 0.18         # 低于它当噪音丢掉
      #     maxPerTurn: 1            # 一轮最多主动提几次
      #
      #   ingest:
      #     llm: auto                # auto | off，是否让模型帮忙抽事实
      #     everyTurns: 20           # 攒够多少轮做一次归纳
      #
      #   debug: false
