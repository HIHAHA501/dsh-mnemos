name: ci

# DSH 桌面端自带 Node 24（崩溃日志里 node: 24.21.0），所以 24 是必须绿的主线。
# Node 22 单独跑一个 job 并且不卡合并：本机没有 22 可复现，已知在 22 上
# 有 1 个 persona 超时用例不通过（cancelledByParent 连带取消同文件后续用例）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node24-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # 零运行时依赖：不需要 install，直接跑测试
      - run: node --test
      - run: node --check index.mjs
      - run: node --check client.js

  legacy-node22:
    name: node22-ubuntu (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
