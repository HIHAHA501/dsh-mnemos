name: ci

# Node 22 一度红过（persona 超时用例赌了 AbortSignal.timeout 的 unref 定时器），
# 用例改成注入 AbortController 之后 22 与 24 都绿，所以 22 留在矩阵里当护栏。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node${{ matrix.node }}-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
        exclude:
          # 22 只看 linux：跨平台差异由 24 的三平台覆盖，避免矩阵翻倍
          - os: windows-latest
            node: "22"
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零运行时依赖：不需要 install，直接跑测试
      - run: node --test
      - run: node --check index.mjs
      - run: node --check client.js
